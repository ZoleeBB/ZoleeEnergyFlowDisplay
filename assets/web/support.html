<style>#development-support{box-sizing:border-box;margin:28px 0 0;padding:20px;border:1px solid #c6d9d0;border-radius:14px;background:#f3f8f5;color:#203d30;font:15px/1.5 system-ui;text-align:left}#development-support h2{margin:0 0 8px;color:inherit;font-size:19px}#development-support p{margin:0 0 14px}#development-support .support-actions{display:flex;flex-wrap:wrap;gap:10px}#development-support a{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;padding:10px 16px;border:1px solid #176b45;border-radius:9px;background:#176b45;color:#fff;text-decoration:none;font:inherit;font-weight:600}#development-support a:hover{background:#105234}#development-support a:focus-visible{outline:3px solid #226ca8;outline-offset:3px}@media(max-width:480px){#development-support .support-actions a{flex:1 1 100%}}</style>
<aside id="development-support" aria-labelledby="development-support-title"><h2 id="development-support-title">{{TITLE}}</h2><p>{{COPY}}</p><div class="support-actions">{{LINKS}}</div></aside>
