name: Lighting development workspace
on:
  push:
    branches: [feature/loxone-lighting-cards]
    paths: [.github/workflows/lighting-development.yml, tools/.lighting-edit.py]
permissions:
  contents: write
concurrency:
  group: lighting-development-workspace
  cancel-in-progress: false
jobs:
  workspace:
    if: github.ref == 'refs/heads/feature/loxone-lighting-cards'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Inspect integration points
        run: |
          grep -nE 'home_prepare|home_preload|home_render|home_is_open|loxone_display_is_held|intercom_render|static void clear' main/app_ui.c
          find assets/web simulator tests -iname '*loxone*' -o -iname '*stub*'
          grep -nE 'app_loxone_home_snapshot|app_loxone_home_command|app_ui.c|int main' tests/preview/preview.c simulator/*.[ch] || true
          grep -nE 'cardType|card.type|control_uuid|cardOptions|supportedControl|typeOptions' assets/web/* || true
      - name: Install C test dependencies
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev zlib1g-dev libmbedtls-dev
      - name: Apply verified integration edit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if test ! -f tools/.lighting-edit.py; then exit 0; fi
          remote=$(git ls-remote origin refs/heads/feature/loxone-lighting-cards | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          python3 tools/.lighting-edit.py
          python3 tools/prepare_web.py
          git diff --check
          git add main assets/web tests simulator docs README.md tools
      - name: Check lighting model with sanitizers
        run: python3 tests/test_lighting.py
      - name: Commit integrated source on the authorized branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if test ! -f tools/.lighting-edit.py; then exit 0; fi
          remote=$(git ls-remote origin refs/heads/feature/loxone-lighting-cards | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          git rm tools/.lighting-edit.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate lighting controls with bounded visible-page state'
          git push origin HEAD:refs/heads/feature/loxone-lighting-cards
