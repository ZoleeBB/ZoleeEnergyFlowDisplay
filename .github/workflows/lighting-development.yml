name: Lighting development workspace
on:
  push:
    branches: [feature/loxone-lighting-cards]
    paths: [.github/workflows/lighting-development.yml, tools/.lighting-edit.py]
permissions:
  contents: write
concurrency:
  group: lighting-development-workspace
  cancel-in-progress: false
jobs:
  workspace:
    if: github.ref == 'refs/heads/feature/loxone-lighting-cards'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev zlib1g-dev libmbedtls-dev python3-pil
      - name: Apply verified integration edit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if test ! -f tools/.lighting-edit.py; then exit 0; fi
          remote=$(git ls-remote origin refs/heads/feature/loxone-lighting-cards | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          python3 tools/.lighting-edit.py
          python3 tools/prepare_web.py
          git diff --check
      - name: Check lighting model and actual client protocol
        run: |
          python3 tests/test_lighting.py
          python3 tests/test_loxone_protocol.py
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.5.0
          path: .preview-lvgl
      - name: Build and exercise actual lighting UI
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          if ! grep -q 'include "app_loxone_lighting_ui.inc"' main/app_loxone_home_ui.inc; then exit 0; fi
          cmake -S tests/preview -B .preview-build -DLVGL_SOURCE_DIR="$PWD/.preview-lvgl" -DCMAKE_BUILD_TYPE=Release -DZOLEE_PREVIEW_ASAN=ON > /tmp/lighting-cmake.log 2>&1 || { tail -100 /tmp/lighting-cmake.log; exit 1; }
          cmake --build .preview-build -j 4 > /tmp/lighting-build.log 2>&1 || { tail -100 /tmp/lighting-build.log; exit 1; }
          python3 tools/prepare_home_resources.py
          mkdir -p .preview-images
          cp -r templates .preview-template-sd
          export ZOLEE_TEMPLATE_ROOT="$PWD/.preview-template-sd"
          export ZOLEE_HOME_RESOURCE_ZIP="$PWD/dist/templates/loxone-home.zip"
          cd .preview-images
          ZOLEE_LIGHTING_ONLY=1 ../.preview-build/ui_preview
          ZOLEE_LIGHTING_ONLY=1 ZOLEE_PREVIEW_RGB565=1 ../.preview-build/ui_preview
      - name: Commit verified source on the authorized branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if test ! -f tools/.lighting-edit.py; then exit 0; fi
          remote=$(git ls-remote origin refs/heads/feature/loxone-lighting-cards | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          git add main assets/web tests simulator docs README.md tools
          git rm tools/.lighting-edit.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate verified lighting UI, configuration and visible-page state'
          git push origin HEAD:refs/heads/feature/loxone-lighting-cards
