name: Waveshare 10.1 Master

# A firmware minden main pushnál és pull requestnél újrafordul.
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: true
  push:
    branches: [ main, feature/loxone-direct, feature/v3-loxone-home ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Ugyanazon ághoz csak a legfrissebb build fusson; a régebbi megszakítható.
concurrency:
  group: esp-idf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  home-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - run: python3 -m pip install Pillow
      - name: Validate complete home icon set and runtime dimensions
        run: python3 tools/import_home_icons.py --complete

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev zlib1g-dev libmbedtls-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tests/run_tests.py

  web-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix /tmp/zolee-web-browser playwright@1.62.1
          node /tmp/zolee-web-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise actual web editor in desktop and mobile Chromium
        env:
          NODE_PATH: /tmp/zolee-web-browser/node_modules
        run: node tests/test_slave_presence_browser.js

  ui-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev zlib1g-dev libmbedtls-dev
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.5.0
          path: .preview-lvgl
      - run: cmake -S tests/preview -B .preview-build -DLVGL_SOURCE_DIR="$PWD/.preview-lvgl" -DCMAKE_BUILD_TYPE=Release -DZOLEE_PREVIEW_ASAN=ON
      - run: cmake --build .preview-build -j 4
      - name: Package shared Loxone resources for actual UI tests
        run: python3 tools/prepare_home_resources.py
      - name: Render actual LVGL screens
        timeout-minutes: 8
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          mkdir -p .preview-images
          cp -r templates .preview-template-sd
          export ZOLEE_TEMPLATE_ROOT="$PWD/.preview-template-sd"
          export ZOLEE_HOME_RESOURCE_ZIP="$PWD/dist/templates/loxone-home.zip"
          cd .preview-images
          ../.preview-build/ui_preview
          ZOLEE_PREVIEW_RGB565=1 ../.preview-build/ui_preview

  template-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - run: python3 tools/prepare_templates.py
      - name: Ensure packaging preserves authored templates
        run: git diff --exit-code -- templates
      - name: Verify every template is included in the artifact
        run: python3 tests/test_template_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: template-packages-${{ inputs.source_sha || github.sha }}
          retention-days: 7
          path: dist/templates/*.zip
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest

    steps:
      # A repository aktuális commitjának letöltése.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Ensure embedded browser pages match current JavaScript
        run: python3 tools/prepare_web.py --check

      - name: Set exact firmware version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.0.0-ci' }}
        run: python3 tools/release/version.py --tag "$RELEASE_TAG"

      # A projekt rögzített ESP-IDF 5.5.4 verzióval, ESP32-P4 célra fordul.
      - name: Build with ESP-IDF 5.5.4
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: '.'

      - name: Package OTA and complete USB installer
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.0.0-ci' }}
          BUILD_COMMIT: ${{ inputs.source_sha || github.sha }}
        run: python3 tools/release/package.py --tag "$RELEASE_TAG" --commit "$BUILD_COMMIT"

      - name: Build Waveshare 4B Slave with the same release version
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: firmware/slave-waveshare-4b

      - name: Package separate Slave OTA and USB installer
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.0.0-ci' }}
          BUILD_COMMIT: ${{ inputs.source_sha || github.sha }}
        run: >-
          python3 tools/release/package.py --board slave-4b
          --build firmware/slave-waveshare-4b/build
          --tag "$RELEASE_TAG" --commit "$BUILD_COMMIT"

      - name: Check USB installer against real build outputs
        run: |
          python3 -m zipfile -e dist/ZoleeEnergyFlowDisplay-${{ inputs.release_tag || 'v0.0.0-ci' }}-usb.zip .usb-check
          python3 -m pip install -r .usb-check/requirements-usb.txt
          python3 -m esptool version
          python3 .usb-check/flash.py --port TEST --dry-run
          python3 .usb-check/flash.py --port TEST --no-stub --manual-boot --dry-run
          python3 -m zipfile -e dist/ZoleeEnergyFlowDisplay-slave-4b-${{ inputs.release_tag || 'v0.0.0-ci' }}-usb.zip .usb-check-slave
          python3 .usb-check-slave/flash.py --port TEST --dry-run
          python3 .usb-check-slave/flash.py --port TEST --no-stub --manual-boot --dry-run

      - name: Upload firmware packages
        uses: actions/upload-artifact@v4
        with:
          name: firmware-packages-${{ inputs.source_sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: dist/*
