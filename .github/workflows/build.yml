name: ESP-IDF build

# A firmware minden main pushnál és pull requestnél újrafordul.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Ugyanazon ághoz csak a legfrissebb build fusson; a régebbi megszakítható.
concurrency:
  group: esp-idf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - run: python3 tests/run_tests.py

  ui-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.5.0
          path: .preview-lvgl
      - run: cmake -S tests/preview -B .preview-build -DLVGL_SOURCE_DIR="$PWD/.preview-lvgl" -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build .preview-build -j 4
      - name: Render actual LVGL screens
        timeout-minutes: 2
        run: |
          mkdir -p .preview-images
          cd .preview-images
          ../.preview-build/ui_preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ github.sha }}
          path: .preview-images/*.ppm
          include-hidden-files: true
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest

    steps:
      # A repository aktuális commitjának letöltése.
      - uses: actions/checkout@v4

      # A projekt rögzített ESP-IDF 5.5.4 verzióval, ESP32-P4 célra fordul.
      - name: Build with ESP-IDF 5.5.4
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: '.'

      # Sikeres build után a teljes első telepítéshez szükséges binárisok megmaradnak.
      - name: Upload firmware binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zolee-energy-flow-display-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flasher_args.json

