name: Release merged PR

# target + merged-only: fork PRs can release too, but no unmerged head is checked out.
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

# Serialize version selection through publication; bursts of merges wait in a queue.
concurrency:
  group: automatic-firmware-release-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Verify merge and select the next patch version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: >-
          python3 tools/release/auto_release.py prepare
          --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --commit "$MERGE_COMMIT"

  firmware:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ github.event.pull_request.merge_commit_sha }}

  publish:
    needs: [prepare, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: firmware-packages-${{ github.event.pull_request.merge_commit_sha }}
          path: dist
      - name: Upload all packages, then publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          python3 tools/release/auto_release.py finish
          --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --commit "$MERGE_COMMIT"
          --tag "$RELEASE_TAG"
