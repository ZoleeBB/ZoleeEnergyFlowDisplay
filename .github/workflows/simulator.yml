name: Windows UI simulator
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC Debug simulator
        run: cmake -S . -B out/simulator -DZOLEE_SIMULATOR=ON -A x64
      - name: Build
        run: cmake --build out/simulator --config Debug --parallel 4
      - name: Validate demo packets, render, timeout and recovery
        run: ctest --test-dir out/simulator -C Debug --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ui-simulator-debug
          path: |
            out/simulator/simulator/Debug/zolee_simulator.exe
            out/simulator/simulator/Debug/zolee_simulator.pdb
            out/simulator/simulator/simulator-demo.ppm
            out/simulator/simulator/templates/
