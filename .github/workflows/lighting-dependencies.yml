name: Lighting protocol test dependency
on:
  push:
    branches: [feature/loxone-lighting-cards]
    paths: [.github/workflows/lighting-dependencies.yml]
permissions:
  contents: read
jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: mbedtls-3.6.5
          persist-credentials: false
      - run: tar -czf /tmp/lighting-mbedtls-headers.tar.gz include
      - uses: actions/upload-artifact@v4
        with:
          name: lighting-mbedtls-headers
          path: /tmp/lighting-mbedtls-headers.tar.gz
          retention-days: 1
