name: Temporary firmware source formatter

on:
  push:
    branches:
      - chore/firmware-kodformatum-magyar-kommentek

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/firmware-kodformatum-magyar-kommentek
          persist-credentials: true
      - name: Install stable formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Format handwritten firmware sources only
        run: |
          find main -maxdepth 1 -type f \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 -r clang-format-18 -i
          git diff --check
      - name: Verify C tokens are unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          rx = re.compile(r'/\*[\s\S]*?\*/|//[^\n]*|"(?:\\[\s\S]|[^"\\])*"|\'(?:\\[\s\S]|[^\'\\])*\'|[A-Za-z_][A-Za-z_0-9]*|[0-9][0-9A-Za-z_.]*|[^\s]')
          def tokens(s):
              return [t for t in rx.findall(s) if not t.startswith(('/*', '//'))]
          for path in sorted(pathlib.Path('main').glob('*')):
              if path.suffix not in ('.c', '.h') or not path.is_file():
                  continue
              old = subprocess.check_output(['git', 'show', 'HEAD:' + str(path)]).decode('utf-8')
              new = path.read_text(encoding='utf-8')
              if tokens(old) != tokens(new):
                  print('Non-whitespace token change:', path, file=sys.stderr)
                  sys.exit(1)
          print('PASS: all handwritten firmware C files preserve their token sequences')
          PY
      - name: Commit formatting to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- main/*.c main/*.h
          if ! git diff --cached --quiet; then
            git commit -m 'style: format all handwritten C firmware source and header files'
            git push origin HEAD:chore/firmware-kodformatum-magyar-kommentek
          fi
