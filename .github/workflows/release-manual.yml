name: Zolee | Kézi kiadás - firmware
run-name: Zolee | Kézi kiadás | ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-firmware-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Ellenőrzés és verziózott csomagok
    uses: ./.github/workflows/ci-shared.yml
    with:
      source_sha: ${{ github.sha }}
      release_tag: ${{ github.event.release.tag_name }}

  publish:
    name: Kiadás | meglévő kézi release mellékletei
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: zolee-firmware-${{ github.sha }}
          path: dist
      - name: Attach assets to the published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: >-
          python3 tools/release/publish.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --release-id "$RELEASE_ID"
