# A projekt rögzített komponensfüggőségei.
dependencies:
  espressif/esp_websocket_client:
    version: "1.6.1"
  espressif/zlib:
    # A project_include.cmake a libpng számára is exportálja a ZLIB::ZLIB célt.
    version: "1.3.2~1"
  # Csak az ESP-IDF 5.5.x sorozat támogatott; a CI konkrétan 5.5.4-et használ.
  idf:
    version: ">=5.5,<5.6"

  # Waveshare ESP32-P4 10.1 colos kijelző BSP.
  waveshare/esp32_p4_wifi6_touch_lcd_x:
    version: "2.0.3"

  # A PSRAM pufferjavítással ellenőrzött adapterverzió.
  espressif/esp_lvgl_adapter:
    version: "0.6.4"
    public: true

  # Felhasználói felület és grafikonok.
  lvgl/lvgl:
    version: "9.5.0"
    public: true

  # Az ESP32-P4 Wi-Fi társprocesszor kommunikációs komponensei.
  espressif/esp_wifi_remote:
    version: "0.14.*"
  espressif/esp_hosted:
    version: "1.4.7"

  # Kihangosított kaputelefon: csak az AEC algoritmust használjuk, beszédmodellek nélkül.
  espressif/esp-sr:
    version: "2.6.0"

  # Helyi .local névfeloldás a web/OTA felülethez.
  espressif/mdns:
    version: "^1.8.2"

